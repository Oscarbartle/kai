[package]
name = "kai-server"
version = "0.1.0"
edition = "2021"
description = "Postgres-backed HTTP API for Kai's shared/remote mode — see CLAUDE.md's Phase B notes. Standalone: no tauri, no rusqlite. Reuses kai-shared's wire types and validation constants; reimplements db::*'s logic against Postgres, since the SQL itself isn't portable from SQLite."

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
deadpool-postgres = "0.14.2"
dotenvy = "0.15.7"
kai-shared = { path = "../kai-shared" }
refinery = { version = "0.9.2", features = ["tokio-postgres"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tokio-postgres = { version = "0.7.18", features = ["with-chrono-0_4", "with-serde_json-1"] }
tower-http = { version = "0.7.0", features = ["trace", "cors"] }

[dev-dependencies]
postgresql_embedded = "0.21.0"
reqwest = { version = "0.13.4", features = ["json"] }

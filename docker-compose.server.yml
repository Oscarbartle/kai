services:
  kai-api:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: kai-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Mount the directory that contains items.json, recipes.json, shopping_lists.json
      # Change the left side to your Unraid data path, e.g. /mnt/user/appdata/kai/data
      - /mnt/user/appdata/kai/data:/data
    environment:
      KAI_DATA_DIR: /data
      KAI_HOST: 0.0.0.0
      KAI_PORT: "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

[package]
name = "kai"
version = "0.3.0"
description = "Kai"
authors = ["Oscar Bartle"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
kai-shared = { path = "../crates/kai-shared" }
async-trait = "0.1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
rusqlite_migration = "2.6.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }

[dev-dependencies]
# For tests/remote_backend.rs — a real embedded Postgres + a real
# kai-server, proving RemoteBackend's HTTP calls actually match what the
# server expects, not just that both sides compile against kai-shared.
kai-server = { path = "../crates/kai-server" }
postgresql_embedded = "0.21.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
axum = "0.8.9"


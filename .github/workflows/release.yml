name: Release

# Builds the Windows installer, signs the update artifacts, and publishes
# a GitHub Release with a `latest.json` manifest — that manifest is what
# Settings.svelte's in-app updater polls (see tauri.conf.json's
# plugins.updater.endpoints). Windows and macOS (Apple Silicon) legs run
# in parallel and tauri-action merges both into the one release and the
# one `latest.json`; an OS with no entry there can't detect updates.
#
# Triggered by pushing a version tag (e.g. `v0.2.0`) — bump the version
# in src-tauri/tauri.conf.json (and package.json, src-tauri/Cargo.toml)
# to match before tagging, or the app's own reported version won't line
# up with the release.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: macos-latest
            args: "--target aarch64-apple-darwin"
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Kai ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
